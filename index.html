<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinHub Pro · Sistema Completo de Finanças</title>
  <meta name="description" content="Controle de gastos, patrimônio, investimentos e assistente IA. Nível dos melhores do mercado.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #070c0a; --sidebar: #0a1210; --card: #111c18; --card2: #0d1714;
      --border: rgba(255,255,255,0.07); --text: #eef6f3; --muted: #7d8f88;
      --primary: #10b981; --primary-dark: #059669; --success: #34d399;
      --danger: #f87171; --warning: #fbbf24; --info: #60a5fa;
      --radius: 14px; --shadow: 0 10px 40px rgba(0,0,0,0.45);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Manrope', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; }
    .sidebar { width: 250px; background: var(--sidebar); border-right: 1px solid var(--border); padding: 20px 12px; display: flex; flex-direction: column; flex-shrink: 0; }
    .logo { display: flex; align-items: center; gap: 10px; padding: 8px 12px; margin-bottom: 28px; }
    .logo-icon { width: 34px; height: 34px; background: linear-gradient(135deg, #10b981, #059669); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 800; color: #fff; }
    .logo h1 { font-family: 'Sora', sans-serif; font-size: 18px; }
    .logo small { display: block; font-size: 10px; color: var(--muted); margin-top: 1px; }
    .nav-sec { font-size: 10px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); margin: 18px 12px 6px; }
    .nav { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; color: var(--muted); cursor: pointer; font-size: 14px; font-weight: 500; transition: 0.15s; }
    .nav:hover { background: rgba(255,255,255,0.04); color: var(--text); }
    .nav.active { background: rgba(16,185,129,0.14); color: var(--primary); }
    .nav svg { width: 18px; height: 18px; }
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .topbar { height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; border-bottom: 1px solid var(--border); background: rgba(7,12,10,0.85); backdrop-filter: blur(10px); }
    .topbar h2 { font-family: 'Sora', sans-serif; font-size: 20px; }
    .topbar .sub { font-size: 12px; color: var(--muted); }
    .content { flex: 1; overflow-y: auto; padding: 24px 28px; }
    .content::-webkit-scrollbar { width: 5px; } .content::-webkit-scrollbar-thumb { background: #1a2a24; border-radius: 3px; }
    .grid { display: grid; gap: 16px; }
    .g4 { grid-template-columns: repeat(4, 1fr); }
    .g3 { grid-template-columns: repeat(3, 1fr); }
    .g2 { grid-template-columns: 1.7fr 1fr; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
    .card h3 { font-size: 13px; color: var(--muted); font-weight: 500; margin-bottom: 6px; }
    .big { font-family: 'Sora', sans-serif; font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
    .pos { color: var(--success); } .neg { color: var(--danger); }
    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 20px; font-size: 11.5px; font-weight: 600; }
    .badge.up { background: rgba(52,211,153,0.15); color: var(--success); }
    .badge.down { background: rgba(248,113,113,0.15); color: var(--danger); }
    .btn { background: var(--primary); color: #fff; border: none; padding: 10px 18px; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 14px; }
    .btn:hover { background: var(--primary-dark); }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .tx-list { display: flex; flex-direction: column; gap: 8px; }
    .tx { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; background: var(--card2); border-radius: 10px; }
    .tx-left { display: flex; align-items: center; gap: 12px; }
    .tx-ico { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
    .tx-name { font-weight: 600; font-size: 14px; }
    .tx-meta { font-size: 12px; color: var(--muted); }
    .tx-val { font-weight: 700; }
    .page { display: none; } .page.active { display: block; }
    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.65); display: none; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(4px); }
    .modal-bg.show { display: flex; }
    .modal { background: var(--card); border-radius: 16px; padding: 24px; width: 440px; max-width: 92%; border: 1px solid var(--border); }
    .modal h3 { font-family: 'Sora', sans-serif; margin-bottom: 16px; }
    .fg { margin-bottom: 12px; }
    .fg label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .fg input, .fg select, .fg textarea { width: 100%; padding: 10px 12px; background: #0a1210; border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 14px; }
    .fg input:focus, .fg select:focus { outline: none; border-color: var(--primary); }
    .progress { height: 8px; background: #1a2a24; border-radius: 4px; overflow: hidden; margin-top: 6px; }
    .progress-bar { height: 100%; background: var(--primary); border-radius: 4px; }
    .chat-box { display: flex; flex-direction: column; height: calc(100vh - 140px); }
    .msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 78%; padding: 12px 16px; border-radius: 14px; line-height: 1.45; font-size: 14px; }
    .msg.user { align-self: flex-end; background: var(--primary); color: #fff; border-bottom-right-radius: 4px; }
    .msg.ai { align-self: flex-start; background: #15241f; border-bottom-left-radius: 4px; }
    .chat-in { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--border); }
    .chat-in input { flex: 1; padding: 12px 14px; background: #0a1210; border: 1px solid var(--border); border-radius: 10px; color: var(--text); }
    .currency-select { background: #0a1210; border: 1px solid var(--border); color: var(--text); padding: 6px 10px; border-radius: 8px; font-size: 13px; }
    @media (max-width: 1024px) { .g4 { grid-template-columns: repeat(2, 1fr); } .g2 { grid-template-columns: 1fr; } }
    @media (max-width: 700px) { .sidebar { width: 68px; } .logo h1, .logo small, .nav span, .nav-sec { display: none; } .nav { justify-content: center; } .g4, .g3 { grid-template-columns: 1fr; } .content { padding: 16px; } }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-icon">F</div>
      <div><h1>FinHub</h1><small>PRO · Completo</small></div>
    </div>
    <div class="nav-sec">Visão</div>
    <div class="nav active" data-p="dash"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg><span>Dashboard</span></div>
    <div class="nav" data-p="tx"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 16l4-4 4 4 6-6"/></svg><span>Transações</span></div>
    <div class="nav" data-p="orc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg><span>Orçamentos</span></div>
    <div class="nav" data-p="metas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg><span>Metas</span></div>
    <div class="nav-sec">Patrimônio</div>
    <div class="nav" data-p="contas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg><span>Contas & Cartões</span></div>
    <div class="nav" data-p="inv"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-3"/></svg><span>Investimentos</span></div>
    <div class="nav-sec">Inteligência</div>
    <div class="nav" data-p="ia"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>Assistente IA</span></div>
    <div class="nav" data-p="rel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg><span>Relatórios</span></div>
    <div style="margin-top: auto; padding-top: 12px; border-top: 1px solid var(--border);">
      <div class="nav" data-p="notas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8"/></svg><span>Notas</span></div>
      <div class="nav" data-p="cfg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span>Configurações</span></div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h2 id="title">Dashboard</h2>
        <div class="sub" id="subtitle">Visão geral completa</div>
      </div>
      <div style="display: flex; align-items: center; gap: 12px;">
        <select class="currency-select" id="currency" onchange="setCurrency(this.value)">
          <option value="BRL">BRL · R$</option>
          <option value="USD">USD · $</option>
          <option value="EUR">EUR · €</option>
        </select>
        <button class="btn" onclick="openModal('tx')">＋ Nova transação</button>
      </div>
    </header>
    <div class="content" id="content"></div>
  </main>

  <!-- Modais -->
  <div class="modal-bg" id="modal-tx">
    <div class="modal">
      <h3>Nova / Editar Transação</h3>
      <input type="hidden" id="tx-id">
      <div class="fg"><label>Descrição</label><input id="tx-desc" placeholder="Ex: Supermercado"></div>
      <div class="fg"><label>Valor</label><input id="tx-val" type="number" step="0.01" placeholder="0.00"></div>
      <div class="fg"><label>Tipo</label>
        <select id="tx-type"><option value="expense">Despesa</option><option value="income">Receita</option><option value="transfer">Transferência</option></select>
      </div>
      <div class="fg"><label>Categoria</label>
        <select id="tx-cat">
          <option>Alimentação</option><option>Moradia</option><option>Transporte</option><option>Lazer</option>
          <option>Saúde</option><option>Educação</option><option>Assinaturas</option><option>Investimento</option><option>Outros</option>
        </select>
      </div>
      <div class="fg"><label>Conta</label><select id="tx-acc"></select></div>
      <div class="fg"><label>Data</label><input id="tx-date" type="date"></div>
      <button class="btn" style="width:100%" onclick="saveTx()">Salvar</button>
      <button class="btn btn-ghost" style="width:100%; margin-top:8px" onclick="closeModals()">Cancelar</button>
    </div>
  </div>

  <script>
    // ========== DATA LAYER (pronto para nuvem) ==========
    const DB = {
      key: 'finhub_pro_v1',
      load() {
        const raw = localStorage.getItem(this.key);
        if (raw) return JSON.parse(raw);
        return this.seed();
      },
      save(data) { localStorage.setItem(this.key, JSON.stringify(data)); },
      seed() {
        return {
          currency: 'BRL',
          rates: { BRL: 1, USD: 0.18, EUR: 0.165 },
          accounts: [
            { id: 1, name: 'Nubank', type: 'checking', balance: 8450, currency: 'BRL' },
            { id: 2, name: 'Itaú', type: 'checking', balance: 12300, currency: 'BRL' },
            { id: 3, name: 'Cartão Nubank', type: 'credit', balance: -1840, currency: 'BRL' },
            { id: 4, name: 'XP Investimentos', type: 'investment', balance: 28600, currency: 'BRL' }
          ],
          transactions: [
            { id: 1, desc: 'Salário', val: 9200, type: 'income', cat: 'Receita', acc: 1, date: '2026-11-01' },
            { id: 2, desc: 'Freelance', val: 1800, type: 'income', cat: 'Receita', acc: 1, date: '2026-11-04' },
            { id: 3, desc: 'Aluguel', val: -1950, type: 'expense', cat: 'Moradia', acc: 1, date: '2026-11-05' },
            { id: 4, desc: 'Supermercado Extra', val: -412.5, type: 'expense', cat: 'Alimentação', acc: 1, date: '2026-11-07' },
            { id: 5, desc: 'Uber', val: -58.9, type: 'expense', cat: 'Transporte', acc: 3, date: '2026-11-08' },
            { id: 6, desc: 'Netflix + Spotify', val: -72.8, type: 'expense', cat: 'Assinaturas', acc: 3, date: '2026-11-10' },
            { id: 7, desc: 'Farmácia', val: -96.4, type: 'expense', cat: 'Saúde', acc: 1, date: '2026-11-11' },
            { id: 8, desc: 'Aporte Tesouro', val: -2000, type: 'expense', cat: 'Investimento', acc: 1, date: '2026-11-12' },
            { id: 9, desc: 'Restaurante', val: -187.3, type: 'expense', cat: 'Alimentação', acc: 3, date: '2026-11-14' }
          ],
          budgets: [
            { cat: 'Alimentação', limit: 1200, spent: 0 },
            { cat: 'Moradia', limit: 2200, spent: 0 },
            { cat: 'Transporte', limit: 500, spent: 0 },
            { cat: 'Lazer', limit: 400, spent: 0 },
            { cat: 'Assinaturas', limit: 150, spent: 0 }
          ],
          goals: [
            { id: 1, name: 'Reserva de Emergência', target: 30000, current: 18500, deadline: '2026-12-31' },
            { id: 2, name: 'Viagem Europa', target: 15000, current: 4200, deadline: '2027-06-30' },
            { id: 3, name: 'Entrada Apartamento', target: 80000, current: 12600, deadline: '2028-12-31' }
          ],
          notes: [
            { id: 1, title: 'Renegociar plano de celular', text: 'Vence em 12 dias. Possível economia de R$ 35/mês.' },
            { id: 2, title: 'Pesquisar IPCA+ 2029', text: 'Boa proteção inflacionária para parte da reserva.' }
          ]
        };
      }
    };

    // Inicializa state ANTES de qualquer função que o use (evita TDZ)
    var state = DB.load();

    function persist() { DB.save(state); render(); }

    // Currency helpers (sem default param que referencia state)
    const symbols = { BRL: 'R$', USD: '$', EUR: '€' };
    function fmt(v, cur) {
      cur = cur || (state && state.currency) || 'BRL';
      const rate = (state && state.rates && state.rates[cur]) ? state.rates[cur] / state.rates.BRL : 1;
      const converted = v * rate;
      return symbols[cur] + ' ' + converted.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
    function setCurrency(c) { 
      if (!state) return;
      state.currency = c; 
      persist(); 
    }

    // Compute derived
    function compute() {
      const month = new Date().toISOString().slice(0, 7);
      const monthTx = state.transactions.filter(t => t.date.startsWith(month));
      const income = monthTx.filter(t => t.type === 'income').reduce((s, t) => s + t.val, 0);
      const expense = Math.abs(monthTx.filter(t => t.type === 'expense').reduce((s, t) => s + t.val, 0));
      const net = income - expense;
      const netWorth = state.accounts.reduce((s, a) => s + a.balance, 0);

      // Update budget spent
      state.budgets.forEach(b => {
        b.spent = Math.abs(monthTx.filter(t => t.cat === b.cat && t.type === 'expense').reduce((s, t) => s + t.val, 0));
      });

      return { income, expense, net, netWorth, monthTx };
    }

    // ========== RENDER ==========
    const titles = {
      dash: ['Dashboard', 'Visão geral completa'],
      tx: ['Transações', 'Gerencie todas as movimentações'],
      orc: ['Orçamentos', 'Controle mensal por categoria'],
      metas: ['Metas', 'Seus objetivos financeiros'],
      contas: ['Contas & Cartões', 'Patrimônio líquido'],
      inv: ['Investimentos', 'Carteira e rendimentos'],
      ia: ['Assistente IA', 'Análises e recomendações'],
      rel: ['Relatórios', 'Tendências e exportação'],
      notas: ['Notas', 'Lembretes e ideias'],
      cfg: ['Configurações', 'Preferências e dados']
    };

    function render() {
      const c = compute();
      document.getElementById('title').textContent = titles[currentPage][0];
      document.getElementById('subtitle').textContent = titles[currentPage][1];
      const el = document.getElementById('content');
      if (currentPage === 'dash') el.innerHTML = renderDash(c);
      else if (currentPage === 'tx') el.innerHTML = renderTx();
      else if (currentPage === 'orc') el.innerHTML = renderOrc();
      else if (currentPage === 'metas') el.innerHTML = renderMetas();
      else if (currentPage === 'contas') el.innerHTML = renderContas();
      else if (currentPage === 'inv') el.innerHTML = renderInv();
      else if (currentPage === 'ia') el.innerHTML = renderIA();
      else if (currentPage === 'rel') el.innerHTML = renderRel(c);
      else if (currentPage === 'notas') el.innerHTML = renderNotas();
      else if (currentPage === 'cfg') el.innerHTML = renderCfg();
      if (currentPage === 'dash' || currentPage === 'rel') setTimeout(initCharts, 50);
      document.getElementById('tx-acc').innerHTML = state.accounts.map(a => `<option value="${a.id}">${a.name}</option>`).join('');
    }

    function renderDash(c) {
      const recent = [...state.transactions].sort((a,b) => b.date.localeCompare(a.date)).slice(0, 6);
      return `
        <div class="grid g4" style="margin-bottom:16px">
          <div class="card"><h3>Patrimônio líquido</h3><div class="big pos">${fmt(c.netWorth)}</div><div class="badge up">↑ 9,2% no mês</div></div>
          <div class="card"><h3>Receitas (mês)</h3><div class="big pos">${fmt(c.income)}</div><div style="font-size:12px;color:var(--muted)">${state.transactions.filter(t=>t.type==='income').length} lançamentos</div></div>
          <div class="card"><h3>Despesas (mês)</h3><div class="big neg">${fmt(c.expense)}</div><div style="font-size:12px;color:var(--muted)">${state.transactions.filter(t=>t.type==='expense').length} lançamentos</div></div>
          <div class="card"><h3>Economia</h3><div class="big pos">${fmt(c.net)}</div><div style="font-size:12px;color:var(--muted)">${c.income?Math.round(c.net/c.income*100):0}% da renda</div></div>
        </div>
        <div class="grid g2" style="margin-bottom:16px">
          <div class="card"><h3>Evolução do patrimônio</h3><div style="height:240px"><canvas id="lineC"></canvas></div></div>
          <div class="card"><h3>Gastos por categoria</h3><div style="height:240px"><canvas id="donutC"></canvas></div></div>
        </div>
        <div class="grid g2">
          <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h3 style="margin:0">Transações recentes</h3><a href="#" onclick="go('tx');return false" style="color:var(--primary);font-size:13px">Ver todas</a></div>
            <div class="tx-list">${recent.map(t => txRow(t)).join('')}</div>
          </div>
          <div class="card">
            <h3>Próximas contas</h3>
            <div style="margin-top:12px;color:var(--muted);font-size:14px">Nenhuma conta pendente esta semana 🎉</div>
            <div style="margin-top:24px"><h3>Ações rápidas</h3>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px">
                <button class="btn" onclick="openModal('tx')">＋ Transação</button>
                <button class="btn btn-ghost" onclick="go('metas')">Ver metas</button>
              </div>
            </div>
          </div>
        </div>`;
    }

    function txRow(t) {
      const icon = t.type === 'income' ? '💰' : t.cat === 'Moradia' ? '🏠' : t.cat === 'Alimentação' ? '🛒' : t.cat === 'Transporte' ? '🚗' : t.cat === 'Investimento' ? '📈' : '📦';
      const bg = t.type === 'income' ? '#1a3a28' : '#3a1a1a';
      return `<div class="tx"><div class="tx-left"><div class="tx-ico" style="background:${bg}">${icon}</div><div><div class="tx-name">${t.desc}</div><div class="tx-meta">${t.cat} · ${t.date.slice(8,10)}/${t.date.slice(5,7)}</div></div></div><div class="tx-val ${t.val>0?'pos':'neg'}">${fmt(t.val)}</div></div>`;
    }

    function renderTx() {
      const list = [...state.transactions].sort((a,b) => b.date.localeCompare(a.date));
      return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><div><h3 style="color:var(--text);font-size:16px">Todas as transações</h3><p style="color:var(--muted);font-size:13px">${list.length} lançamentos</p></div><button class="btn" onclick="openModal('tx')">＋ Nova</button></div>
      <div class="tx-list">${list.map(t => `<div class="tx" style="cursor:pointer" onclick="editTx(${t.id})">${txRow(t).replace('<div class="tx">','').replace('</div>','')}</div>`).join('')}</div>`;
    }

    function renderOrc() {
      return `<div class="grid g2">${state.budgets.map(b => {
        const pct = Math.min(100, Math.round(b.spent / b.limit * 100));
        const color = pct > 90 ? 'var(--danger)' : pct > 70 ? 'var(--warning)' : 'var(--primary)';
        return `<div class="card"><h3>${b.cat}</h3><div style="display:flex;justify-content:space-between;margin:8px 0"><span>${fmt(b.spent)}</span><span style="color:var(--muted)">${fmt(b.limit)}</span></div><div class="progress"><div class="progress-bar" style="width:${pct}%;background:${color}"></div></div><div style="font-size:12px;color:var(--muted);margin-top:6px">${pct}% usado</div></div>`;
      }).join('')}</div>`;
    }

    function renderMetas() {
      return `<div class="grid g3">${state.goals.map(g => {
        const pct = Math.round(g.current / g.target * 100);
        return `<div class="card"><h3>${g.name}</h3><div class="big">${fmt(g.current)}</div><div style="font-size:13px;color:var(--muted);margin:6px 0">de ${fmt(g.target)} · ${pct}%</div><div class="progress"><div class="progress-bar" style="width:${pct}%"></div></div><div style="font-size:12px;color:var(--muted);margin-top:8px">Prazo: ${g.deadline.split('-').reverse().join('/')}</div></div>`;
      }).join('')}</div>`;
    }

    function renderContas() {
      const total = state.accounts.reduce((s,a) => s + a.balance, 0);
      return `<div class="card" style="margin-bottom:16px"><h3>Patrimônio total</h3><div class="big pos">${fmt(total)}</div></div>
      <div class="grid g2">${state.accounts.map(a => `<div class="card"><h3>${a.name}</h3><div class="big ${a.balance>=0?'pos':'neg'}">${fmt(a.balance)}</div><div style="font-size:12px;color:var(--muted);text-transform:capitalize;margin-top:4px">${a.type}</div></div>`).join('')}</div>`;
    }

    function renderInv() {
      return `<div class="grid g3" style="margin-bottom:16px">
        <div class="card"><h3>Total investido</h3><div class="big">${fmt(28600)}</div><div class="badge up">↑ 7,4% no ano</div></div>
        <div class="card"><h3>Rendimento YTD</h3><div class="big pos">${fmt(1980)}</div></div>
        <div class="card"><h3>Alocação</h3><div class="big">62%</div><div style="font-size:13px;color:var(--muted)">Renda fixa</div></div>
      </div>
      <div class="card"><h3>Carteira</h3>
        <div class="tx-list" style="margin-top:12px">
          <div class="tx"><div class="tx-left"><div class="tx-ico" style="background:#1e3a5f">📈</div><div><div class="tx-name">Tesouro Selic</div><div class="tx-meta">Renda fixa</div></div></div><div class="tx-val pos">${fmt(16200)}</div></div>
          <div class="tx"><div class="tx-left"><div class="tx-ico" style="background:#3f2a1e">📊</div><div><div class="tx-name">IVVB11</div><div class="tx-meta">ETF EUA</div></div></div><div class="tx-val pos">${fmt(8400)}</div></div>
          <div class="tx"><div class="tx-left"><div class="tx-ico" style="background:#1e3f2a">💰</div><div><div class="tx-name">CDB 110% CDI</div><div class="tx-meta">Inter</div></div></div><div class="tx-val pos">${fmt(4000)}</div></div>
        </div>
      </div>`;
    }

    function renderIA() {
      return `<div class="card" style="padding:0;overflow:hidden">
        <div style="padding:16px 20px;border-bottom:1px solid var(--border)"><h3 style="margin:0;color:var(--text)">Assistente Financeiro IA</h3><p style="color:var(--muted);font-size:13px;margin-top:4px">Análises baseadas nos seus dados reais</p></div>
        <div class="chat-box">
          <div class="msgs" id="msgs"><div class="msg ai">Olá! Analisei seus dados. Você está economizando ${Math.round(compute().net/compute().income*100||0)}% da renda este mês. Como posso ajudar?</div></div>
          <div class="chat-in"><input id="ai-in" placeholder="Pergunte sobre gastos, metas, projeções..." onkeypress="if(event.key==='Enter')askAI()"><button class="btn" onclick="askAI()">Enviar</button></div>
        </div>
      </div>`;
    }

    function renderRel(c) {
      return `<div class="card"><h3>Receitas vs Despesas (últimos meses)</h3><div style="height:280px"><canvas id="barC"></canvas></div>
      <div style="margin-top:16px;display:flex;gap:12px">
        <button class="btn" onclick="exportCSV()">Exportar CSV</button>
        <button class="btn btn-ghost" onclick="alert('PDF gerado (simulado)')">Exportar PDF</button>
      </div></div>`;
    }

    function renderNotas() {
      return `<div class="card"><h3>Notas</h3><div class="tx-list" style="margin-top:12px">${state.notes.map(n => `<div class="tx"><div><div class="tx-name">${n.title}</div><div class="tx-meta">${n.text}</div></div></div>`).join('')}</div></div>`;
    }

    function renderCfg() {
      return `<div class="card"><h3>Preferências</h3>
        <div class="fg"><label>Moeda principal</label><select onchange="setCurrency(this.value)"><option value="BRL" ${state.currency==='BRL'?'selected':''}>Real (BRL)</option><option value="USD" ${state.currency==='USD'?'selected':''}>Dólar (USD)</option><option value="EUR" ${state.currency==='EUR'?'selected':''}>Euro (EUR)</option></select></div>
        <div class="fg"><label>Nome</label><input value="Usuário FinHub Pro"></div>
        <button class="btn" style="margin-top:8px" onclick="alert('Salvo localmente')">Salvar</button>
        <div style="margin-top:24px"><button class="btn btn-ghost" onclick="if(confirm('Limpar todos os dados?')){localStorage.removeItem(DB.key);location.reload()}">Resetar dados</button></div>
      </div>`;
    }

    // Charts
    function initCharts() {
      if (document.getElementById('lineC')) {
        new Chart(document.getElementById('lineC'), {
          type: 'line',
          data: { labels: ['Jun','Jul','Ago','Set','Out','Nov'], datasets: [{ data: [31200,34800,38100,41200,45600,48750], borderColor: '#10b981', backgroundColor: 'rgba(16,185,129,0.08)', tension: 0.4, fill: true, pointRadius: 3 }] },
          options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#7d8f88' } }, y: { grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#7d8f88' } } } }
        });
      }
      if (document.getElementById('donutC')) {
        new Chart(document.getElementById('donutC'), {
          type: 'doughnut',
          data: { labels: ['Moradia','Alimentação','Transporte','Assinaturas','Saúde','Outros'], datasets: [{ data: [1950,600,280,180,96,220], backgroundColor: ['#10b981','#34d399','#6ee7b7','#a7f3d0','#d1fae5','#ecfdf5'], borderWidth: 0 }] },
          options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { color: '#7d8f88', padding: 10, font: { size: 11 } } } }, cutout: '62%' }
        });
      }
      if (document.getElementById('barC')) {
        new Chart(document.getElementById('barC'), {
          type: 'bar',
          data: { labels: ['Jun','Jul','Ago','Set','Out','Nov'], datasets: [{ label: 'Receitas', data: [10500,11200,9800,12400,11800,11000], backgroundColor: '#10b981' }, { label: 'Despesas', data: [6200,6800,5900,7100,6400,5800], backgroundColor: '#f87171' }] },
          options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: '#7d8f88' } } }, scales: { x: { grid: { display: false }, ticks: { color: '#7d8f88' } }, y: { grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#7d8f88' } } } }
        });
      }
    }

    // Navigation
    let currentPage = 'dash';
    function go(p) { currentPage = p; document.querySelectorAll('.nav').forEach(n => n.classList.remove('active')); document.querySelector(`.nav[data-p="${p}"]`).classList.add('active'); render(); }
    document.querySelectorAll('.nav').forEach(n => n.onclick = () => go(n.dataset.p));

    // Modals & CRUD
    function openModal(type) {
      document.getElementById('tx-id').value = '';
      document.getElementById('tx-desc').value = '';
      document.getElementById('tx-val').value = '';
      document.getElementById('tx-date').value = new Date().toISOString().slice(0,10);
      document.getElementById('modal-tx').classList.add('show');
    }
    function closeModals() { document.querySelectorAll('.modal-bg').forEach(m => m.classList.remove('show')); }
    function editTx(id) {
      const t = state.transactions.find(x => x.id === id);
      if (!t) return;
      document.getElementById('tx-id').value = t.id;
      document.getElementById('tx-desc').value = t.desc;
      document.getElementById('tx-val').value = Math.abs(t.val);
      document.getElementById('tx-type').value = t.type;
      document.getElementById('tx-cat').value = t.cat;
      document.getElementById('tx-acc').value = t.acc;
      document.getElementById('tx-date').value = t.date;
      document.getElementById('modal-tx').classList.add('show');
    }
    function saveTx() {
      const id = document.getElementById('tx-id').value;
      const desc = document.getElementById('tx-desc').value || 'Sem descrição';
      let val = parseFloat(document.getElementById('tx-val').value) || 0;
      const type = document.getElementById('tx-type').value;
      if (type === 'expense') val = -Math.abs(val);
      else val = Math.abs(val);
      const tx = {
        id: id ? +id : Date.now(),
        desc, val, type,
        cat: document.getElementById('tx-cat').value,
        acc: +document.getElementById('tx-acc').value,
        date: document.getElementById('tx-date').value
      };
      if (id) {
        const idx = state.transactions.findIndex(t => t.id === +id);
        if (idx >= 0) state.transactions[idx] = tx;
      } else state.transactions.unshift(tx);
      persist();
      closeModals();
    }

    function askAI() {
      const input = document.getElementById('ai-in');
      const text = input.value.trim();
      if (!text) return;
      const msgs = document.getElementById('msgs');
      msgs.innerHTML += `<div class="msg user">${text}</div>`;
      input.value = '';
      setTimeout(() => {
        const c = compute();
        const replies = [
          `Seu patrimônio atual é ${fmt(c.netWorth)}. Economia do mês: ${fmt(c.net)} (${Math.round(c.net/(c.income||1)*100)}% da renda).`,
          `Maior gasto este mês: Moradia. Se reduzir alimentação em 15%, economiza cerca de ${fmt(90)} por mês.`,
          `Suas metas estão em bom ritmo. A Reserva de Emergência está em ${Math.round(18500/30000*100)}%. Continue os aportes.`,
          `Recomendação: aloque mais 10% da economia mensal em renda fixa para acelerar a meta de emergência.`
        ];
        msgs.innerHTML += `<div class="msg ai">${replies[Math.floor(Math.random()*replies.length)]}</div>`;
        msgs.scrollTop = msgs.scrollHeight;
      }, 500);
      msgs.scrollTop = msgs.scrollHeight;
    }

    function exportCSV() {
      const rows = [['Data','Descrição','Categoria','Tipo','Valor','Conta']];
      state.transactions.forEach(t => {
        const acc = state.accounts.find(a => a.id === t.acc)?.name || '';
        rows.push([t.date, t.desc, t.cat, t.type, t.val, acc]);
      });
      const csv = rows.map(r => r.join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'finhub-transacoes.csv';
      a.click();
    }

    // Init
    document.getElementById('tx-date').value = new Date().toISOString().slice(0,10);
    render();
  </script>
</body>
</html>
